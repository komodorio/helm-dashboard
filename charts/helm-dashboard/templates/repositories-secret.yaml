{{- if .Values.dashboard.repositories -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "helm-dashboard.fullname" . }}-repositories
  labels:
    {{- include "helm-dashboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  repositories.yaml: |
    repositories:
    {{- range .Values.dashboard.repositories }}
      {{- $name := required "dashboard.repositories[].name is required" .name }}
      {{- $url := required "dashboard.repositories[].url is required" .url }}
      {{- $username := default "" .username }}
      {{- $password := default "" .password }}
      {{- if ne (empty $username) (empty $password) }}
      {{- fail (printf "dashboard.repositories[%s]: username and password must both be set or both be empty" $name) }}
      {{- end }}
      - name: {{ $name | quote }}
        url: {{ $url | quote }}
        username: {{ $username | quote }}
        password: {{ $password | quote }}
    {{- end }}
{{- end }}
